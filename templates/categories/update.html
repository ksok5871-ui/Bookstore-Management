{% extends 'layout/base.html' %}

{% block title %}Edit Category - {{ category.name }}{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px;">
    <div class="card shadow-sm border-0">

        <!-- Card Header -->
        <div class="card-header bg-warning text-dark py-3">
            <h4 class="mb-0 fs-5"><i class="fa-solid fa-pen-to-square me-2"></i>Edit Category</h4>
        </div>

        <!-- Card Body -->
        <div class="card-body p-4">
            <form action="{{ url_for('update_category', id=category.id) }}" method="POST">

                <!-- Category Name Input -->
                <div class="mb-3">
                    <label for="name" class="form-label fw-bold">Category Name <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="name" name="name" value="{{ category.name }}" required>
                </div>

                <!-- Action Buttons -->
                <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                    <a href="/categories" class="btn btn-secondary px-4">Cancel</a>
                    <button type="submit" class="btn btn-warning px-4 text-dark fw-bold"><i class="fa-solid fa-save me-1"></i>Save Changes</button>
                </div>

            </form>
        </div>
    </div>
</div>
{% endblock %}
