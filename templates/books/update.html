{% extends 'layout/base.html' %}

{% block title %}Edit Book - {{ book.title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0">

            <!-- Card Header -->
            <div class="card-header bg-warning text-dark d-flex justify-content-between align-items-center py-3">
                <h4 class="mb-0 fs-5"><i class="fa-solid fa-pen-to-square me-2"></i>Edit Book Information</h4>
                <a href="{{ url_for('index') }}" class="btn btn-outline-dark btn-sm fw-bold">
                    <i class="fa-solid fa-arrow-left me-1"></i>Cancel
                </a>
            </div>

            <!-- Card Body -->
            <div class="card-body p-4">
                <form action="{{ url_for('update_book', id=book.id) }}" method="POST" enctype="multipart/form-data">

                    <!-- Book Title -->
                    <div class="mb-3">
                        <label for="title" class="form-label fw-bold">Book Title <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="title" name="title" value="{{ book.title }}" required>
                    </div>

                    <!-- Category & Author -->
                    <div class="row">
                        <!-- Category Input -->
                        <div class="col-md-6 mb-3">
                            <label for="category" class="form-label fw-bold">Category <span class="text-danger">*</span></label>
                            <input class="form-control" list="categoryOptions" id="category" name="category" value="{{ book.category or '' }}" placeholder="-- Select or type category --" required>
                            <datalist id="categoryOptions">
                                {% for category in categories %}
                                    <option value="{{ category.name }}">
                                {% endfor %}
                            </datalist>
                        </div>

                        <!-- Author Input -->
                        <div class="col-md-6 mb-3">
                            <label for="author" class="form-label fw-bold">Author</label>
                            <input class="form-control" list="authorOptions" id="author" name="author" value="{{ book.author or '' }}" placeholder="-- Select or type author --">
                            <datalist id="authorOptions">
                                {% for author in authors %}
                                    <option value="{{ author.name }}">
                                {% endfor %}
                            </datalist>
                        </div>
                    </div>

                    <!-- Price, Stock & ISBN -->
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="price" class="form-label fw-bold">Price ($) <span class="text-danger">*</span></label>
                            <input type="number" step="0.01" class="form-control" id="price" name="price" value="{{ book.price }}" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="stock" class="form-label fw-bold">Stock <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="stock" name="stock" value="{{ book.stock }}" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="isbn" class="form-label fw-bold">ISBN</label>
                            <input type="text" class="form-control" id="isbn" name="isbn" value="{{ book.isbn or '' }}">
                        </div>
                    </div>

                    <!-- Current & New Cover Image -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">Current Cover Image</label>
                        <div class="mb-2">
                            <img src="{{ url_for('static', filename='uploads/books/' + (book.cover_image or 'default.jpg')) }}" alt="Current Cover" class="img-thumbnail shadow-sm" style="height: 120px;">
                        </div>
                        <label for="cover_image" class="form-label fw-bold">Upload New Cover (Leave blank to keep current)</label>
                        <input type="file" class="form-control" id="cover_image" name="cover_image" accept="image/*">
                    </div>

                    <!-- Description -->
                    <div class="mb-3">
                        <label for="description" class="form-label fw-bold">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="4">{{ book.description or '' }}</textarea>
                    </div>

                    <!-- Action Buttons -->
                    <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                        <a href="{{ url_for('index') }}" class="btn btn-secondary px-4">Cancel</a>
                        <button type="submit" class="btn btn-warning px-4"><i class="fa-solid fa-save me-1"></i>Save Changes</button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
