{% extends 'layout/base.html' %}

{% block title %}Add New Book{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white fw-bold">
                <i class="fa-solid fa-plus-circle me-2"></i>Add New Book
            </div>
            <div class="card-body">
                <form action="/books/create" method="POST" enctype="multipart/form-data">

                    <!-- Book Title -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">Book Title <span class="text-danger">*</span></label>
                        <input type="text" name="title" class="form-control" placeholder="Enter book title..." required>
                    </div>

                    <!-- Category & Author -->
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Category</label>
                            <input type="text" name="category_input" list="category_list" class="form-control" placeholder="Select or type new category...">
                            <datalist id="category_list">
                                {% for cat in categories %}
                                    <option value="{{ cat.name }}">
                                {% endfor %}
                            </datalist>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">Author</label>
                            <input type="text" name="author_input" list="author_list" class="form-control" placeholder="Select or type new author...">
                            <datalist id="author_list">
                                {% for author in authors %}
                                    <option value="{{ author.name }}">
                                {% endfor %}
                            </datalist>
                        </div>
                    </div>

                    <!-- Price & Stock -->
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Price ($) <span class="text-danger">*</span></label>
                            <input type="number" step="0.01" name="price" class="form-control" placeholder="0.00" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">Stock <span class="text-danger">*</span></label>
                            <input type="number" name="stock" class="form-control" value="1" required>
                        </div>
                    </div>

                    <!-- ISBN -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">ISBN</label>
                        <input type="text" name="isbn" class="form-control" placeholder="Enter ISBN code...">
                    </div>

                    <!-- Cover Image -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">Book Cover Image</label>
                        <input type="file" name="cover_image" class="form-control" accept="image/*">
                    </div>

                    <!-- Description -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">Description</label>
                        <textarea name="description" class="form-control" rows="4" placeholder="Enter book description..."></textarea>
                    </div>

                    <!-- Action Buttons -->
                    <div class="d-flex justify-content-between">
                        <a href="/" class="btn btn-secondary">Back</a>
                        <button type="submit" class="btn btn-success">Save Book</button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
